<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting — Glacial Tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #F8FAFC;
      color: #0F172A;
    }
    .loader-box {
      text-align: center;
      padding: 32px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      max-width: 400px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E2E8F0;
      border-top-color: #145CFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #64748B; margin: 0; }
  </style>
  <script>
    // Universal SPA 404 Redirect Handler
    // Captures the missing path and redirects to the SPA root with a hash or query route
    (function() {
      var pathname = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      if (pathname && pathname !== '/' && pathname !== '/index.html') {
        // Redirect to /#/product/... or /#/...
        var targetHash = '#' + pathname + search + hash;
        window.location.replace('/' + targetHash);
      } else {
        window.location.replace('/' + (search ? search : '') + hash);
      }
    })();
  </script>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <h2>Loading Glacial Tech...</h2>
    <p>Connecting to product experience...</p>
  </div>
</body>
</html>
