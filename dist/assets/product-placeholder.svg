<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4FAFD"/>
      <stop offset="100%" stop-color="#EAF4FC"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#168FC2"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="32" y="32" width="736" height="736" rx="24" fill="none" stroke="#DCEAF1" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(400, 350)">
    <!-- Tech Nest Hexagon / Cube Logo Icon outline -->
    <path d="M-60,-35 L0,-70 L60,-35 L60,35 L0,70 L-60,35 Z" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0,-70 L0,0 L60,35 M0,0 L-60,35" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Subtle camera / photo icon in center -->
    <circle cx="0" cy="0" r="14" fill="#168FC2" opacity="0.85"/>
  </g>
  <text x="400" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#102A43" letter-spacing="1">IMAGE PENDING VERIFICATION</text>
  <text x="400" y="508" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#62788A">Authentic studio photography in review</text>
  <text x="400" y="720" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2">TECH NEST • VERIFIED CATALOG</text>
</svg>
